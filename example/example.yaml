# 比赛名称
name: "2024年足球友谊赛"

# 主视频文件
main_video: "game.mp4"

# 参赛队伍信息
teams:
  - name: "大一班"
    color: "红色"  # 队伍颜色名称（用于解说）
    code: "YIBAN"  # 队伍代码
    score: 0       # 上一节比赛结束时的比分（可选，默认0）
  - name: "大二班"
    color: "蓝色"
    code: "ERBAN"
    score: 1


